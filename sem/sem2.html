    <title>CHEMISTRY CYCLE</title>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff3eb;
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 60px 20px 20px 20px;
            text-align: center;
            color: #000000;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards;
        }

header {
            background-color: #fff3db;
            color: #ff0000;

            padding: 20px 0;
            border-bottom: 2px solid #e43131;
            border-radius: 8px;
            font-family: 'Roboto', sans-serif;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.5s;
        }

        header h1 {
             font-weight: 900;
      letter-spacing: 2px;
      margin: 0;
      font-size: clamp(1.5em, 5vw, 2.5em);
        }
        
        h3 {
            color: #000000;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: left;
        }

        .menu-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        .menu-item:nth-child(1) {
            animation-delay: 0.5s;
        }

        .menu-item:nth-child(2) {
            animation-delay: 0.55s;
        }

        .menu-item:nth-child(3) {
            animation-delay: 0.60s;
        }

        .menu-item:nth-child(4) {
            animation-delay: 0.65s;
        }

        .menu-item:nth-child(5) {
            animation-delay: 0.70s;
        }

        .menu-item:nth-child(6) {
            animation-delay: 0.75s;
        }

        .menu-item:nth-child(7) {
            animation-delay: 0.85s;
        }

        .menu-item:nth-child(8) {
            animation-delay: 0.90s;
        }
        .menu-item:nth-child(9) {
            animation-delay: 0.95s;
        }
        .menu-item:nth-child(10) {
            animation-delay: 1.00s;
        }
        .menu-item:nth-child(11) {
            animation-delay: 1.05s;
        }

        footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #000000;
            opacity: 0;
            animation: fadeIn 0.82s ease forwards 0.9s;
        }

        button {
            padding: 15px;
            width: 45%;
            background: linear-gradient(to right, #000000, #fd2828);
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s;
            margin-right: 10px;
        }

        button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .semester-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .search-container {
            margin: 20px 0;
        }

        input[type="text"] {
            width: 75%;
            /* Adjust the width as needed */
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #081174;
            font-size: 1em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #2193b0;
            outline: none;
        }

        .back-button {

            margin-top: 20px;
            padding: 10px 15px;
             background: linear-gradient(to right, #000000, #fd2828);
            color: white;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.3s, transform 0.3s;
            /* Animation effects */
            width: 100%;
            /* Set width to 100% */
            max-width: 200px;
            /* Max-width for the back button */
            margin-left: auto;
            /* Center align */
            margin-right: auto;
            /* Center align */
            font-size: 0.9em;
            /* Slightly smaller font size for back button */
        }

        .back-button:hover {
            opacity: 0.8;
            /* Slightly transparent on hover */
            transform: scale(1.05);
            /* Slightly enlarge on hover */
        }
    </style>
    <style>
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background-color: #f1f1f1;
            padding: 5px 0;
            position: relative;
        }

        .marquee {
            display: inline-block;
            animation: continuous-scroll 10s linear infinite;
            position: relative;
        }

        @keyframes continuous-scroll {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .marquee a {
            color: blue;
            text-decoration: underline;
            margin-left: 10px;
        }

        .navbar {
            list-style: none;
            display: flex;
            padding: 15px;
            margin: 0;
        }

        nav div {
            background: linear-gradient(to right, #000000, #fd2828);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-radius: 8px;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            padding: 12px 15px;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .navbar li {
            margin: 0 1px;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            border-radius: 5px;
            padding: 15px;
            transition: background-color 0.3s ease;
        }

        .navbar a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            body {
                padding: 52px 10px 10px 10px;
            }

            .hamburger {
                display: block;
            }

            .navbar {
                display: none;
                flex-direction: column;
                padding: 0;
            }

            .navbar.open {
                display: flex;
            }

            .navbar li {
                margin: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
            }

            .navbar a {
                display: block;
                padding: 12px 15px;
                width: 100%;
            }

            button {
                width: 90%;
                margin: 5px 0;
            }

            .menu-item {
                flex-direction: column;
            }

            input[type="text"] {
                width: 90%;
            }

            header h1 {
                font-size: clamp(1.3em, 5vw, 2.5em);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 48px 8px 8px 8px;
            }

            header {
                padding: 12px 0;
            }

            button {
                padding: 12px;
                font-size: 0.9em;
                width: 95%;
            }

            input[type="text"] {
                width: 95%;
                padding: 8px;
            }

            footer {
                font-size: 0.8em;
            }
        }
    </style>
    <script>
        const courses = [
            { name: 'Applied Digital Logic Design', code: 'EC1002-2', link: '../subjects/ADLD/0.html' },
            { name: 'Basic Electrical Engineering', code: 'EE1001-2', link: '../subjects/BEE/0.html' },
            { name: 'Biology for Engineers', code: 'BT1651-1', link: '../subjects/BfE/0.html' },
            { name: 'Discrete Mathematics and Transform Techniques', code: 'MA1007-1', link: '../subjects/DMTT/0.html' },
            { name: 'Engineering Visualization', code: 'ME1004-1', link: '../subjects/EV/0.html' },
            { name: 'Environmental Studies and Sustainability', code: 'CV1005-1', link: '../subjects/EVS/0.html' },
            { name: 'Introduction to Python Programming', code: 'CS1005-2', link: '../subjects/IPP/0.html' },
            { name: 'Materials Chemistry for Computer Systems', code: 'CY1003-1', link: '../subjects/MCfCS/0.html' },
            { name: 'Constitution of India', code: 'HU1002-1', link: '../subjects/COI/0.html' },
            { name: 'Technical English', code: 'HU1001-1', link: '../subjects/TE/0.html' }
        ];

        function filterCourses() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const menuList = document.getElementById('menuList');
            menuList.innerHTML = ''; // Clear current list

            const filteredCourses = courses.filter(course =>
                course.name.toLowerCase().includes(searchInput) ||
                course.code.toLowerCase().includes(searchInput)
            );

            filteredCourses.forEach(course => {
                const menuItem = document.createElement('div');
                menuItem.classList.add('menu-item');
                menuItem.innerHTML = `
                    <button onclick="window.location.href='${course.link}'">${course.name}</button>
                    <button onclick="window.location.href='${course.link}'">${course.code}</button>
                `;
                menuList.appendChild(menuItem);
            });

            if (filteredCourses.length === 0) {
                menuList.innerHTML = '<p>No courses found. Please try a different search.</p>';
            }
        }
        function goBack() {
            window.location.href = '../index.html';
        }

        function toggleNav() {
            document.getElementById('navbar').classList.toggle('open');
        }
    </script>
